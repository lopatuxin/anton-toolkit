name: Build Codex and Kimi packages

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'adapters/**'
      - 'scripts/build-codex.mjs'
      - 'scripts/build-kimi.mjs'
      - 'tests/**'
      - 'package*.json'
      - '.claude-plugin/marketplace.json'
      - '.github/workflows/codex-packages.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: npm run check
      - name: Publish generated packages on main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git add -- codex .agents/plugins/marketplace.json kimi
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Обновил сборку плагинов для Codex и Kimi'
          git push origin HEAD:main
